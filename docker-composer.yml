services:
  chishi-meow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chishi-meow
    restart: unless-stopped
    environment:
      - AUTO_UPDATE=1
      - BRANCH=main
      - PY_FILE=bot.py
      - REQUIREMENTS_FILE=requirements.txt
      - INSTALL_PLAYWRIGHT=1
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - THREADS_USERNAME=${THREADS_USERNAME}
      - THREADS_CHANNEL_ID=${THREADS_CHANNEL_ID}
      - DB_PATH=${DB_PATH}

volumes:
  chishi_data:
    name: chishi-meow-data