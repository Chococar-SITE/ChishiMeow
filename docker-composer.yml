services:
  chishi-meow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chishi-meow
    restart: unless-stopped
    environment:
      - AUTO_UPDATE=1
      - BRANCH=main
      - PY_FILE=bot.py
      - REQUIREMENTS_FILE=requirements.txt
      - INSTALL_PLAYWRIGHT=1
      # 敏感變數不寫在這裡，改在 Portainer 介面填入

volumes:
  chishi_data:
    name: chishi-meow-data